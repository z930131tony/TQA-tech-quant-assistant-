name: Tech Quant Daily Scheduler & Webpage Deploy

# 定時排程：每天在台股開盤前 (UTC 00:30 = 台灣 08:30) 與美股開盤前 (UTC 13:00 = 台灣 21:00) 自動執行
on:
  schedule:
    - cron: '30 0 * * 1-5'   # 週一至週五 台灣 08:30 (台股開盤前晨間推播)
    - cron: '0 15 * * 1-5'   # 週一至週五 台灣 23:00 (美股冬令開盤後半小時晚間推播)
  push:
    branches: [ main ]       # 每次推送到 main 分支時也自動執行
  workflow_dispatch:         # 支援隨時手動點擊「Run workflow」立即測試

permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 3.12 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化運算、發送 LINE 推播並更新網頁
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python run_daily.py

      - name: 提交更新後的檔案至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add index.html portfolio.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 自動更新股市數據與儀表板 [skip ci]" && git push origin main)

      - name: 自動部署到 GitHub Pages (供手機隨時瀏覽)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: true
