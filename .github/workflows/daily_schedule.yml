name: Tech Quant Daily Scheduler & Webpage Deploy

# 定時排程：
# 1. 台股收盤排程：週一至週五 台灣 14:30 (UTC 06:30)，收盤後一小時結算與晨盤推播
# 2. 美股收盤排程：週一至週五 台灣 05:15 (UTC 21:15)，夏令/冬令收盤後結算與夜盤推播
on:
  schedule:
    - cron: '30 6 * * 1-5'    # 台股收盤結算 (台灣 14:30 / UTC 06:30)
    - cron: '15 21 * * 1-5'   # 美股收盤結算 (台灣 05:15 / UTC 21:15)
  workflow_dispatch:          # 支援 GitHub 網頁手動觸發執行
    inputs:
      market:
        description: '選擇執行市場 (AUTO, TW, US)'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - TW
          - US

permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.12 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化運算、發送 LINE 推播並更新網頁
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PORTFOLIO_SHEET_URL: ${{ secrets.PORTFOLIO_SHEET_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_daily.py --market ${{ github.event.inputs.market || 'AUTO' }}
          python generate_web.py || true

      - name: 提交更新後的檔案至 main 分支
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add index.html portfolio.json
          git diff --staged --quiet || git commit -m "chore(auto): 自動更新股市數據與儀表板 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin main

      - name: 自動部署到 GitHub Pages (供手機隨時瀏覽)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: true
