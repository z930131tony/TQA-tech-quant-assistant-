name: Tech Quant Daily Scheduler

# 定時排程：每天在台股開盤前 (UTC 00:30 = 台灣 08:30) 與美股開盤前 (UTC 13:00 = 台灣 21:00) 自動執行
on:
  schedule:
    - cron: '30 0 * * 1-5'   # 週一至週五 台灣 08:30 (台股晨間)
    - cron: '0 13 * * 1-5'   # 週一至週五 台灣 21:00 (美股晚間)
  workflow_dispatch:         # 支援隨時手動點擊「Run workflow」立即測試

jobs:
  run-tech-quant:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 3.12 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化運算與訊號推播
        run: |
          python verify_step1.py
