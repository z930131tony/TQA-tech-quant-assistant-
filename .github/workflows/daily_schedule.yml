name: Tech Quant Daily Scheduler & Webpage Deploy

# 定時排程：
# 1. 台股收盤排程：週一至週五 台灣 14:30 (UTC 06:30)，收盤後自動更新與推播
# 2. 美股收盤排程：週二至週六 台灣 06:30 (UTC 22:30)，收盤後自動更新與推播
on:
  schedule:
    - cron: '30 6 * * 1-5'    # 台股收盤結算 (台灣 14:30 / UTC 06:30)
    - cron: '30 22 * * 1-5'   # 美股收盤結算 (台灣 06:30 / UTC 22:30)
  workflow_dispatch:          # 支援 GitHub 網頁手動觸發執行
    inputs:
      market:
        description: '選擇執行市場 (AUTO, TW, US)'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - TW
          - US

permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.12 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化運算、發送 LINE 推播並更新網頁
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PORTFOLIO_SHEET_URL: ${{ secrets.PORTFOLIO_SHEET_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_daily.py --market ${{ github.event.inputs.market || 'AUTO' }}
          python generate_web.py || true

      - name: Auto Commit and Push Updated Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html portfolio.json
          git diff --staged --quiet || (git commit -m "chore: auto-update TQA dashboard ($(date +'%Y-%m-%d %H:%M')) [skip ci]" && git pull --rebase --autostash origin main && git push)

      - name: 自動部署到 GitHub Pages (供手機隨時瀏覽)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: true
